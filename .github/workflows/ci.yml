name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create owner role and databases
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres/init/01-owner.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Create app and system roles
        run: pnpm db:roles
        env:
          DATABASE_OWNER_URL: postgres://sethu_owner:sethu_owner_dev@localhost:5432/sethu_test
          APP_ROLE_PASSWORD: sethu_app_dev
      - run: pnpm test:integration
        env:
          TEST_DATABASE_OWNER_URL: postgres://sethu_owner:sethu_owner_dev@localhost:5432/sethu_test
          TEST_DATABASE_URL: postgres://sethu_app:sethu_app_dev@localhost:5432/sethu_test
